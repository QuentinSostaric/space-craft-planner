[package]
name = "item-fabricator"
version = "2.0.0"
description = "Item Fabricator desktop app"
authors = ["TheSamon"]
edition = "2021"
license = "MIT"

[lib]
name = "item_fabricator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23"
reqwest = { version = "0.13.3", default-features = false, features = ["json", "rustls"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tauri = { version = "2", default-features = false, features = ["wry", "x11", "dbus"] }
tauri-plugin-process = "2.3.1"
# Upstream zip v9 security fix; use a full revision until the next registry release includes it.
tauri-plugin-updater = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "ba98bfadc4c868c9a7e1a226c83af528e1f11b89" }
getrandom = "0.4"
keyring = "4"
tokio = { version = "1", features = ["io-util", "net", "time"] }
url = "2"
walkdir = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
