[package]
name = "item-fabricator"
version = "2.0.0"
description = "Item Fabricator desktop app"
authors = ["TheSamon"]
edition = "2021"
license = "MIT"

[lib]
name = "item_fabricator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reqwest = { version = "0.13.3", default-features = false, features = ["json", "rustls"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", default-features = false, features = ["wry", "x11", "dbus", "devtools"] }
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"
getrandom = "0.2"
keyring = "3"
tokio = { version = "1", features = ["io-util", "net", "time"] }
url = "2"
walkdir = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
