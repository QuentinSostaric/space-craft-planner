name = "sc-craft"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

pages_build_output_dir = "client/dist"

[build]
command = "npm run build"

# Variables non-sensibles (collections MongoDB)
[vars]
ATLAS_DB_NAME         = "craft"
ATLAS_LIVE_COLLECTION = "craft-live-data"
ATLAS_PTU_COLLECTION  = "craft-ptu-data"

# ⚠️  Secret à configurer dans le dashboard Cloudflare Pages :
#    Settings → Environment Variables → Add variable (type Secret) :
#    - MONGODB_URI = mongodb+srv://<user>:<password>@<cluster>.mongodb.net/?appName=<App>
#
#    En local, créer un fichier .dev.vars à la racine du projet :
#    MONGODB_URI=mongodb+srv://...
