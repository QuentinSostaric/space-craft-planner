title = "Item Fabricator secret scanning"

[extend]
useDefault = true

[allowlist]
description = "Public, non-secret identifiers (e.g. the Flathub app-id)"
regexTarget = "line"
regexes = [
  # FLATHUB_APP_ID is the public Flatpak/Flathub application id, not a secret.
  '''FLATHUB_APP_ID\s*=''',
]

[[rules]]
id = "hardcoded-oauth-client-id"
description = "Hardcoded OAuth or API client ID"
regex = '''(?i)(?:discord|citizen|rsi|oauth|api|auth)?[_-]?(?:client|application|app)[_-]?id\s*[:=]\s*["']([0-9A-Za-z][0-9A-Za-z._:-]{7,})["']'''
secretGroup = 1
keywords = [
  "client",
  "application",
  "app",
]
tags = ["id", "oauth"]

[[rules]]
id = "hardcoded-oauth-client-secret"
description = "Hardcoded OAuth or API client secret"
regex = '''(?i)(?:discord|citizen|rsi|oauth|api|auth)?[_-]?(?:client|application|app)?[_-]?secret\s*[:=]\s*["']([0-9A-Za-z][0-9A-Za-z._~+/=-]{15,})["']'''
secretGroup = 1
entropy = 3.5
keywords = [
  "secret",
]
tags = ["secret", "oauth"]

[[rules]]
id = "hardcoded-cloudflare-api-token"
description = "Hardcoded Cloudflare API token"
regex = '''(?i)(?:CLOUDFLARE|CF)[_-]?API[_-]?TOKEN\s*[:=]\s*["']?([0-9A-Za-z_-]{30,})'''
secretGroup = 1
entropy = 3.0
keywords = ["cloudflare", "cf_api", "api_token"]
tags = ["secret", "cloudflare"]

[[rules]]
id = "hardcoded-r2-access-key-id"
description = "Hardcoded R2 access key ID"
regex = '''(?i)(?:R2|AWS)[_-]?ACCESS[_-]?KEY[_-]?ID\s*[:=]\s*["']?([0-9A-Za-z_-]{16,})'''
secretGroup = 1
keywords = ["r2_access", "aws_access"]
tags = ["secret", "r2"]

[[rules]]
id = "hardcoded-r2-secret-access-key"
description = "Hardcoded R2 secret access key"
regex = '''(?i)(?:R2|AWS)[_-]?SECRET[_-]?ACCESS[_-]?KEY\s*[:=]\s*["']?([0-9A-Za-z/+=_-]{24,})'''
secretGroup = 1
entropy = 3.0
keywords = ["r2_secret", "aws_secret"]
tags = ["secret", "r2"]

[[rules]]
id = "hardcoded-signing-material"
description = "Hardcoded Tauri or Windows signing material"
regex = '''(?i)(?:TAURI[_-]?SIGNING[_-]?PRIVATE[_-]?KEY|WINDOWS[_-]?CERTIFICATE)\s*[:=]\s*["']?([0-9A-Za-z/+=_-]{24,})'''
secretGroup = 1
entropy = 3.0
keywords = ["tauri_signing", "windows_certificate"]
tags = ["secret", "signing"]
