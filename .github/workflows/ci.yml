name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: cd client && npx tsc --noEmit

      - name: Patch MongoDB for CF Workers TLS
        run: node scripts/patchMongoTls.mjs

      - name: Verify MongoDB TLS patch
        run: |
          if grep -q 'tls-cf-shim' node_modules/mongodb/lib/cmap/connect.js; then
            echo "MongoDB TLS patch verified"
          else
            echo "ERROR: MongoDB TLS patch not applied — connect.js still uses node:tls. The deploy would 500 in production."
            exit 1
          fi

      - name: Build
        run: npm run build
