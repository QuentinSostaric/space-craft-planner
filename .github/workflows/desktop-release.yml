name: Desktop Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: --target x86_64-pc-windows-msvc --bundles nsis
          - platform: ubuntu-24.04
            args: --bundles appimage

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.14.0'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-06-30
        if: runner.os == 'Windows'
        with:
          targets: x86_64-pc-windows-msvc

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-06-30
        if: runner.os == 'Linux'

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Validate repository configuration
        run: npm run config:check

      - name: Validate updater signing secrets (optional)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          has_key=0
          has_pwd=0
          if [[ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then has_key=1; fi
          if [[ -n "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" ]]; then has_pwd=1; fi
          
          if (( has_key != has_pwd )); then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD must be configured together. Skipping signing."
            echo "SIGN_ENABLED=false" >> "$GITHUB_ENV"
          elif (( has_key == 1 )); then
            echo "SIGN_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "SIGN_ENABLED=false" >> "$GITHUB_ENV"
          fi

      - name: Configure Windows Authenticode signing
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)
          $hasCertificatePassword = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)

          if ($hasCertificate -xor $hasCertificatePassword) {
            Write-Error "WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD must be configured together."
            exit 1
          }

          if (-not $hasCertificate) {
            Write-Host "Windows Authenticode signing is not configured — skipping it."
            exit 0
          }

          $certificateBase64 = (
            $env:WINDOWS_CERTIFICATE -split "\r?\n" |
              Where-Object { $_ -notmatch "^-+BEGIN " -and $_ -notmatch "^-+END " }
          ) -join ""

          $certificatePath = Join-Path $env:RUNNER_TEMP "item-fabricator-windows-codesign.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($certificateBase64))

          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $certificate = Import-PfxCertificate `
            -FilePath $certificatePath `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $password

          if (-not $certificate.Thumbprint) {
            Write-Host "Certificate import did not return a thumbprint — skipping Authenticode signing."
            exit 0
          }

          $configPath = "src-tauri\tauri.conf.json"
          $config = Get-Content -Raw -LiteralPath $configPath | ConvertFrom-Json -Depth 100
          $config.bundle.windows.certificateThumbprint = $certificate.Thumbprint
          $config.bundle.windows.digestAlgorithm = "sha256"
          $config.bundle.windows.timestampUrl = "http://timestamp.digicert.com"
          $config | ConvertTo-Json -Depth 100 | Set-Content -LiteralPath $configPath -Encoding utf8
          Write-Host "Authenticode signing configured with thumbprint $($certificate.Thumbprint)."

      - name: Build and upload desktop bundles
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VITE_API_BASE_URL: https://itemfab.space
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npm run tauri
          tagName: ${{ github.event.release.tag_name || github.ref_name }}
          releaseName: 'Item Fabricator ${{ github.event.release.tag_name || github.ref_name }}'
          releaseBody: 'Desktop release for Item Fabricator.'
          releaseDraft: false
          prerelease: false
          assetNamePattern: '[name]-[version]-[platform]-[arch]-[bundle][setup][ext]'
          args: ${{ matrix.args }}
