name: Desktop Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build (for example v2.4.3)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build-desktop:
    permissions:
      contents: write
      actions: read
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: --target x86_64-pc-windows-msvc --bundles nsis
          - platform: ubuntu-24.04
            args: --bundles appimage

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: refs/tags/${{ github.event.release.tag_name || inputs.release_tag }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-06-30
        if: runner.os == 'Windows'
        with:
          targets: x86_64-pc-windows-msvc

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-06-30
        if: runner.os == 'Linux'

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: './src-tauri -> target'

      - name: Verify release source passed CI and was promoted to production
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/validateReleaseSource.mjs

      - name: Install dependencies
        run: npm ci

      - name: Validate release tag matches app version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: npm run release:check-version

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Validate repository configuration
        run: npm run config:check

      - name: Require updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is required for signed desktop updates."
            exit 1
          fi

      - name: Configure Windows Authenticode signing
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)
          $hasCertificatePassword = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)

          if ($hasCertificate -xor $hasCertificatePassword) {
            Write-Error "WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD must be configured together."
            exit 1
          }

          if (-not $hasCertificate) {
            Write-Host "Windows Authenticode signing is not configured — skipping it."
            exit 0
          }

          $certificateBase64 = (
            $env:WINDOWS_CERTIFICATE -split "\r?\n" |
              Where-Object { $_ -notmatch "^-+BEGIN " -and $_ -notmatch "^-+END " }
          ) -join ""

          $certificatePath = Join-Path $env:RUNNER_TEMP "item-fabricator-windows-codesign.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($certificateBase64))

          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $certificate = Import-PfxCertificate `
            -FilePath $certificatePath `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $password

          if (-not $certificate.Thumbprint) {
            Write-Host "Certificate import did not return a thumbprint — skipping Authenticode signing."
            exit 0
          }

          $configPath = "src-tauri\tauri.conf.json"
          $config = Get-Content -Raw -LiteralPath $configPath | ConvertFrom-Json -Depth 100
          $config.bundle.windows.certificateThumbprint = $certificate.Thumbprint
          $config.bundle.windows.digestAlgorithm = "sha256"
          $config.bundle.windows.timestampUrl = "http://timestamp.digicert.com"
          $config | ConvertTo-Json -Depth 100 | Set-Content -LiteralPath $configPath -Encoding utf8
          Write-Host "Authenticode signing configured with thumbprint $($certificate.Thumbprint)."

      - name: Build and upload desktop bundles
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VITE_API_BASE_URL: https://itemfab.space
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npm run tauri
          tagName: ${{ github.event.release.tag_name || inputs.release_tag }}
          releaseId: ${{ github.event.release.id }}
          releaseDraft: false
          prerelease: false
          releaseAssetNamePattern: '[name]-[version]-[platform]-[arch]-[bundle][setup][ext]'
          args: ${{ matrix.args }} -- --locked
