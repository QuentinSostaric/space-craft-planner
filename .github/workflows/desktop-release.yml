name: Desktop Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: --target x86_64-pc-windows-msvc --bundles nsis
          - platform: ubuntu-24.04
            args: --bundles appimage,deb

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        if: runner.os == 'Windows'
        with:
          targets: x86_64-pc-windows-msvc

      - uses: dtolnay/rust-toolchain@stable
        if: runner.os == 'Linux'

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Configure Windows Authenticode signing
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            throw "Missing WINDOWS_CERTIFICATE secret. Add a base64-encoded .pfx code-signing certificate."
          }
          if (-not $env:WINDOWS_CERTIFICATE_PASSWORD) {
            throw "Missing WINDOWS_CERTIFICATE_PASSWORD secret. Add the .pfx export password."
          }

          $certificateBase64 = (
            $env:WINDOWS_CERTIFICATE -split "\r?\n" |
              Where-Object { $_ -notmatch "^-+BEGIN " -and $_ -notmatch "^-+END " }
          ) -join ""

          $certificatePath = Join-Path $env:RUNNER_TEMP "item-fabricator-windows-codesign.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($certificateBase64))

          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $certificate = Import-PfxCertificate `
            -FilePath $certificatePath `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $password

          if (-not $certificate.Thumbprint) {
            throw "Windows code-signing certificate import did not return a thumbprint."
          }

          $configPath = "src-tauri\tauri.conf.json"
          $config = Get-Content -Raw -LiteralPath $configPath | ConvertFrom-Json -Depth 100
          $config.bundle.windows.certificateThumbprint = $certificate.Thumbprint
          $config.bundle.windows.digestAlgorithm = "sha256"
          $config.bundle.windows.timestampUrl = "http://timestamp.digicert.com"
          $config | ConvertTo-Json -Depth 100 | Set-Content -LiteralPath $configPath -Encoding utf8

      - name: Build and upload desktop bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_API_BASE_URL: https://itemfab.space
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npm run tauri
          tagName: ${{ github.event.release.tag_name || github.ref_name }}
          releaseName: 'Item Fabricator ${{ github.event.release.tag_name || github.ref_name }}'
          releaseBody: 'Desktop release for Item Fabricator.'
          releaseDraft: false
          prerelease: false
          assetNamePattern: '[name]-[version]-[platform]-[arch]-[bundle][setup][ext]'
          args: ${{ matrix.args }}
